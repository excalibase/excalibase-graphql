server:
  port: 10000
  tomcat:
    threads:
      max: 200  # Limit max threads (virtual threads handle concurrency)
      min-spare: 10
    max-connections: 10000
    accept-count: 100
    connection-timeout: 20000
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB
spring:
  application:
    name: Excalibase graphql
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
  datasource:
    driver-class-name: org.postgresql.Driver
    # No built-in database or credentials. Single-database mode sets all three
    # (SPRING_DATASOURCE_URL/USERNAME/PASSWORD) or refuses to start; multi-tenant
    # mode leaves the URL empty.
    url: ${POSTGRES_URL:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 50  # Limit connection pool
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jackson:
    default-property-inclusion: non_null  # Reduce JSON serialization overhead
  jmx:
    enabled: false  # Disable JMX to save memory

# Actuator + Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    enable:
      jvm: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        http.server.requests: false  # Disable histogram to save memory
  # OTLP export — all three signals go to the OTel Collector on port 4318
  # Actuator is kept only for health + info; metrics/traces/logs go via OTLP push.
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s        # push interval
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  # Tracing: sample 100% in dev; tune via OTEL_TRACES_SAMPLER_ARG in prod
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}

app:
  project-id: ${APP_PROJECT_ID:}  # single-database mode: the one project this database serves (required); unset in multi-tenant mode
  database-type: postgres
  max-rows: 30
  max-query-depth: 15  # Reject queries nested beyond this depth (0 = unlimited)
  reserved-schemas: ${APP_RESERVED_SCHEMAS:}  # Extra schemas never reflected into the API; adds to the built-in list (auth, excalibase), cannot remove from it
  cache:
    schema-ttl-minutes: 30  # Schema cache TTL in minutes (default: 30 minutes)
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}      # platform default: routes without a project (health, actuator, legacy unscoped)
    provisioning-url: ${APP_CORS_PROVISIONING_URL:${app.security.rls.policy-url:}}  # per-project allowlist source (GET {url}/projects/{id}/info); empty = platform default everywhere
    # The service token is the shared provisioning one (app.security.rls.policy-pat[-file],
    # else app.security.multi-tenant.provisioning-pat[-file]); there is no CORS-specific token.
    ttl-ms: 30000                                      # per-project cache; last-good is served while provisioning is down
  security:
    jwt-enabled: ${JWT_ENABLED:true}                 # off only together with insecure-dev-mode
    insecure-dev-mode: ${APP_SECURITY_INSECURE_DEV_MODE:false}  # local development only: allows jwt-enabled=false, logged at ERROR
    auth:
      jwks-url: ${APP_SECURITY_AUTH_JWKS_URL:}        # JWKS endpoint (excalibase-auth or any OIDC provider)
      hmac-secret: ${APP_SECURITY_AUTH_HMAC_SECRET:}  # HS256 shared secret (standalone mode)
      require-aud: ${JWT_REQUIRE_AUD:true}            # Require aud to cover the project in the URL path
      aud-prefix: ${AUTH_AUD_PREFIX:excalibase:}      # Prefix excalibase-auth puts before the projectId in aud
    multi-tenant:
      provisioning-url: ${PROVISIONING_URL:}    # Mode 3 only
      provisioning-pat: ${PROVISIONING_PAT:}    # standalone/dev fallback when no token file is mounted
      provisioning-pat-file: ${APP_SECURITY_MULTI_TENANT_PROVISIONING_PAT_FILE:}  # re-read on change, wins over the literal
      unknown-project-cache:            # vault 404s remembered so a missing project costs one vault call per TTL
        max-entries: 10000              # LRU bound: random project ids cannot grow memory past this
        ttl-seconds: 30                 # a project created after a 404 is reachable once this expires
  nats:
    enabled: false  # Enable NATS CDC subscription from excalibase-watcher (default: false)
    url: nats://localhost:4222  # NATS server URL
    stream-name: CDC  # JetStream stream name
    subject-prefix: cdc  # Subject prefix (events on cdc.{schema}.{table})
    tenant-in-subject: false  # When true, subject shape is cdc.{tenantId}.{schema}.{table} (multi-tenant)
    # Bus credential (EXC-324). The platform NATS server scopes subject permissions
    # per principal; svc-graphql may subscribe cdc.> and policies.> and publish nothing.
    username: ${APP_NATS_USERNAME:}
    password: ${APP_NATS_PASSWORD:}
    # Reply-inbox prefix this principal is allowed to subscribe to. Must match what
    # the server grants, or JetStream requests time out. Blank = client default.
    inbox-prefix: ${APP_NATS_INBOX_PREFIX:}
logging:
  level:
    root: ${log.level.root:info}
    org:
      springframework: ${log.level.spring:info}
    io:
      github:
        excalibase: ${log.level.app:info}
  # Structured JSON logging (ECS format) — parseable by any log collector (Loki, OpenSearch, etc.)
  # Override with LOG_FORMAT=plain for local dev coloured output
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  pattern:
    console: "%d{ISO8601} %highlight(%-5level) [%blue(%t)] [%blue(%X{remoteAddr})] %yellow(%C{1}): %msg%n%throwable"