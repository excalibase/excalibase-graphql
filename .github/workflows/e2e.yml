name: End-to-End Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '*.md'
      - '.github/workflows/docs.yml'
  schedule:
    - cron: '0 2 * * *' # nightly: the full native set
  workflow_dispatch: # Allow manual triggering

jobs:
  maven-warm:
    name: Warm Maven cache
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache
      with:
        warm: 'true'

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  postgres-e2e:
    name: Postgres E2E Tests
    runs-on: ubuntu-24.04
    needs: maven-warm
    if: ${{ !cancelled() }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'
        
    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache
    - name: Download JAR artifacts (if from workflow_run)
      if: github.event_name == 'workflow_run'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: jar-artifacts
        path: modules/excalibase-graphql-api/target/
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
        
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'

    - name: Install dependencies (required by make targets)
      run: |
        # Install docker-compose if missing (GitHub Actions has 'docker compose' but make uses 'docker-compose')
        if ! command -v docker-compose >/dev/null 2>&1; then
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version
        fi
        
    - name: Run complete E2E test suite (queries, mutations, CDC subscriptions)
      run: make ci
      
    - name: Upload application logs on failure
      if: failure()
      run: |
        echo "📋 Collecting application logs..."
        if docker-compose -f docker-compose.yml -p excalibase-e2e logs excalibase-app > app-logs.txt 2>&1; then
          echo "✅ Logs collected"
        else
          echo "⚠️ No logs available or services not running"
        fi
        
    - name: Upload logs as artifact
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: postgres-e2e-logs
        path: |
          app-logs.txt
        retention-days: 3
        if-no-files-found: ignore

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  # The binary is compiled once per run; every native job below packages this one.
  native-build:
    name: Build Native Binary
    runs-on: ubuntu-24.04
    needs: maven-warm
    if: ${{ !cancelled() }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'graalvm'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache

    - name: Install native-image prerequisites
      run: sudo apt-get update && sudo apt-get install -y gcc zlib1g-dev

    - name: Build native binary
      run: mvn -pl modules/excalibase-graphql-api --also-make -Pnative package -DskipTests

    - name: Upload native binary
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: native-binary
        path: modules/excalibase-graphql-api/target/excalibase-graphql-api
        retention-days: 1
        if-no-files-found: error

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  postgres-e2e-native:
    name: Postgres E2E Tests (Native)
    needs: native-build
    if: ${{ !cancelled() && needs.native-build.result == 'success' }}
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download the native binary
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: native-binary
        path: modules/excalibase-graphql-api/target/

    - name: Make binary executable
      run: chmod +x modules/excalibase-graphql-api/target/excalibase-graphql-api

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'

    - name: Install docker-compose if missing
      run: |
        if ! command -v docker-compose >/dev/null 2>&1; then
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
        fi
    - name: Run Postgres E2E Tests (Native)
      run: make postgres-e2e-native NATIVE_PREBUILT=1

    - name: Collect logs on failure
      if: failure()
      run: |
        docker-compose -f docker-compose.native.yml -p excalibase-native-app logs > native-app-logs.txt 2>&1 || true

    - name: Upload logs as artifact
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: postgres-native-e2e-logs
        path: native-app-logs.txt
        retention-days: 3
        if-no-files-found: ignore

  multi-tenant-e2e-native:
    name: Multi-Tenant E2E Tests (Native)
    needs: native-build
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.native-build.result == 'success' && github.event_name != 'pull_request' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download the native binary
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: native-binary
        path: modules/excalibase-graphql-api/target/

    - name: Make binary executable
      run: chmod +x modules/excalibase-graphql-api/target/excalibase-graphql-api

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'

    - name: Run Multi-Tenant E2E Tests (Native)
      run: make multi-tenant-e2e-native NATIVE_PREBUILT=1

    - name: Collect logs on failure
      if: failure()
      run: |
        docker compose -f e2e/multi-tenant/docker-compose.multi-tenant.yml -p excalibase-multi-tenant logs mt-excalibase-graphql > native-app-logs.txt 2>&1 || true

    - name: Upload logs as artifact
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: multi-tenant-native-e2e-logs
        path: native-app-logs.txt
        retention-days: 3
        if-no-files-found: ignore

  study-cases-e2e-native:
    name: Study-Cases E2E Tests (Native)
    needs: native-build
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.native-build.result == 'success' && github.event_name != 'pull_request' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download the native binary
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: native-binary
        path: modules/excalibase-graphql-api/target/

    - name: Make binary executable
      run: chmod +x modules/excalibase-graphql-api/target/excalibase-graphql-api

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'

    - name: Run Study-Cases E2E Tests (Native)
      run: make study-cases-e2e-native NATIVE_PREBUILT=1

    - name: Collect logs on failure
      if: failure()
      run: |
        docker compose -f e2e/study-cases/docker-compose.study-cases.yml -p excalibase-study-cases logs sc-excalibase-graphql > native-app-logs.txt 2>&1 || true

    - name: Upload logs as artifact
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: study-cases-native-e2e-logs
        path: native-app-logs.txt
        retention-days: 3
        if-no-files-found: ignore

  mysql-e2e-native:
    name: MySQL E2E Tests (Native)
    needs: native-build
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.native-build.result == 'success' && github.event_name != 'pull_request' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download the native binary
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: native-binary
        path: modules/excalibase-graphql-api/target/

    - name: Make binary executable
      run: chmod +x modules/excalibase-graphql-api/target/excalibase-graphql-api

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'

    - name: Run MySQL E2E Tests (Native)
      run: make mysql-e2e-native NATIVE_PREBUILT=1

    - name: Collect logs on failure
      if: failure()
      run: |
        docker compose -f docker-compose.mysql.yml -p excalibase-mysql-app logs excalibase-app > native-app-logs.txt 2>&1 || true

    - name: Upload logs as artifact
      if: failure()
