    - name: Run study-cases E2E tests
      run: make study-cases-e2e

    - name: Upload application logs on failure
      if: failure()
      run: |
        docker compose -f e2e/study-cases/docker-compose.study-cases.yml -p excalibase-study-cases logs sc-excalibase-graphql > app-logs.txt 2>&1 || true

    - name: Upload logs as artifact
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: study-cases-e2e-logs
        path: app-logs.txt
        retention-days: 3
        if-no-files-found: ignore

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  mysql-e2e:
    name: MySQL E2E Tests
    runs-on: ubuntu-24.04
    needs: maven-warm
    if: ${{ !cancelled() }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'

    - name: Run MySQL E2E tests
      run: make mysql-e2e

    - name: Upload application logs on failure
      if: failure()
      run: |
        echo "📋 Collecting MySQL application logs..."
        if docker compose -f docker-compose.mysql.yml -p excalibase-mysql-app logs excalibase-app > app-logs.txt 2>&1; then
          echo "✅ Logs collected"
        else
          echo "⚠️ No logs available or services not running"
        fi

    - name: Upload logs as artifact
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: mysql-e2e-logs
        path: |
          app-logs.txt
        retention-days: 3
        if-no-files-found: ignore

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  contracts-e2e:
    name: Engine Contracts
    runs-on: ubuntu-24.04
    needs: maven-warm
    if: ${{ !cancelled() }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up JDK 25
