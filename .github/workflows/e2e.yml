      with:
        name: mysql-native-e2e-logs
        path: native-app-logs.txt
        retention-days: 3
        if-no-files-found: ignore

  contracts-e2e-native:
    name: Engine Contracts (Native)
    needs: native-build
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.native-build.result == 'success' && github.event_name != 'pull_request' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download the native binary
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: native-binary
        path: modules/excalibase-graphql-api/target/

    - name: Make binary executable
      run: chmod +x modules/excalibase-graphql-api/target/excalibase-graphql-api

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'

    - name: Run engine contract tests against the native image
      run: make contracts-e2e-native NATIVE_PREBUILT=1

    - name: Upload engine logs on failure
      if: failure()
