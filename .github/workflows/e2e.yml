    - name: Upload application logs on failure
      if: failure()
      run: |
        docker compose -f e2e/multi-tenant/docker-compose.multi-tenant.yml -p excalibase-multi-tenant logs mt-excalibase-graphql > app-logs.txt 2>&1 || true

    - name: Upload logs as artifact
      if: failure()
