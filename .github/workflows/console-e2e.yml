name: Console browser test

# Playwright specs against real engines: the old console (sign in, view, edit, save, a stale save, errors, markup as
# text, export, a read-only source) and the default one, driven as a person drives it, under its real policy. Separate from the Maven build; it only
# needs the engine jar (built here with the new console in it) and Postgres.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '*.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

env:
  # EXC-881: Docker Hub rate-limits CI, so third-party images come from the mirror the platform
  # repository's Mirror images workflow keeps in GHCR (ci/mirror-images.txt lists the ones used here).
  # Empty on a fork PR (no login there): everything then pulls Docker Hub as before.
  # HUB_MIRROR: compose files and Dockerfiles. IMAGE_MIRROR: scripts (ci/mirror-images.sh).
  # TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: Testcontainers, for every container the Java tests start.
  HUB_MIRROR: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'ghcr.io/excalibase/mirror/' || '' }}
  IMAGE_MIRROR: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'ghcr.io/excalibase/mirror' || '' }}
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'ghcr.io/excalibase/mirror/' || '' }}

jobs:
  maven-warm:
    name: Warm Maven cache
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache
      with:
        warm: 'true'

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  console:
    name: Console browser test
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    needs: maven-warm
    if: ${{ !cancelled() }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Log in to the image mirror
      uses: ./.github/actions/mirror-login

    # EXC-881: a step, not a `services:` entry, so the image follows HUB_MIRROR: the mirror for same-repo runs,
    # Docker Hub (empty prefix) for fork PRs, which skip the login.
    - name: Start Postgres
      run: |
        docker run -d --name console-postgres -p 5432:5432 \
          -e POSTGRES_DB=app -e POSTGRES_USER=app -e POSTGRES_PASSWORD=change-me \
          --health-cmd "pg_isready -U app -d app" --health-interval 5s --health-retries 20 \
          "${HUB_MIRROR}postgres:16-alpine"
        for _ in $(seq 1 40); do
          [ "$(docker inspect -f '{{.State.Health.Status}}' console-postgres)" = healthy ] && exit 0
          sleep 3
        done
        echo "Postgres did not become healthy"; docker logs console-postgres; exit 1

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache

    - name: Cache npm packages of the new console
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.npm
        key: ${{ runner.os }}-console-ui-npm-${{ hashFiles('modules/excalibase-graphql-api/console-ui/package-lock.json') }}

    # the console-ui profile is on in every build: it installs its own Node, then lints, tests (Vitest) and builds the
    # console into the jar
    - name: Build the engine jar with the console
      run: mvn --batch-mode -q -pl modules/excalibase-graphql-api -am package -DskipTests

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: console-e2e/package-lock.json

    - name: Install the test toolchain
      working-directory: console-e2e
      run: npm ci --ignore-scripts

    - name: Cache the browser
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('console-e2e/package-lock.json') }}

    - name: Install the browser
      working-directory: console-e2e
      run: npm run browsers

    - name: Create the example tables
      run: |
        PGPASSWORD=change-me psql -h localhost -U app -d app -f deploy/standalone/init.sql
        PGPASSWORD=change-me psql -h localhost -U app -d app -f console-e2e/shop.sql

    - name: Run the console test
      working-directory: console-e2e
      env:
        CI: "true"
        E2E_DATABASE_URL: jdbc:postgresql://localhost:5432/app
      run: npm test

    - name: Upload the report on failure
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: console-e2e-report
        path: |
          console-e2e/playwright-report
          console-e2e/test-results

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report
