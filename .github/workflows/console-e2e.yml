name: Console browser test

# One Playwright spec against a real engine: sign in, view, edit, save, a stale save, errors, markup as text,
# export, and a read-only source. Separate from the Maven build; it only needs the engine jar and Postgres.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '*.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  maven-warm:
    name: Warm Maven cache
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache
      with:
        warm: 'true'

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  console:
    name: Console browser test
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    needs: maven-warm
    if: ${{ !cancelled() }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-retries 20

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache

    - name: Build the engine jar
      run: mvn --batch-mode -q -pl modules/excalibase-graphql-api -am package -DskipTests

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: console-e2e/package-lock.json

    - name: Install the test toolchain
      working-directory: console-e2e
      run: npm ci --ignore-scripts

    - name: Cache the browser
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('console-e2e/package-lock.json') }}

    - name: Install the browser
      working-directory: console-e2e
      run: npm run browsers

    - name: Create the example table
      run: PGPASSWORD=change-me psql -h localhost -U app -d app -f deploy/standalone/init.sql

    - name: Run the console test
      working-directory: console-e2e
      env:
        CI: "true"
        E2E_DATABASE_URL: jdbc:postgresql://localhost:5432/app
      run: npm test

    - name: Upload the report on failure
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: console-e2e-report
        path: |
          console-e2e/playwright-report
          console-e2e/test-results

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report
