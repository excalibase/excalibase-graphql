name: Continuous Integration

# release/** runs the same suites as main: a patch is cut on release/<major>.<minor>
# and CD (cd.yml) publishes release-<major>.<minor>-<sha> from the commit this run passes on.
on:
  push:
    branches: [ main, "release/**" ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main, "release/**" ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '*.md'
      - '.github/workflows/docs.yml'

env:
  MAVEN_OPTS: "-Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

jobs:
  maven-warm:
    name: Warm Maven cache
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache
      with:
        warm: 'true'

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  cd-guard:
    name: CD tag guard
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Check the trunk tag guard
      run: scripts/ci/test-cd-guard.sh

    - name: Check the release tag guard
      run: scripts/ci/test-release-tag-guard.sh

    - name: Check the Maven retry loop
      run: scripts/ci/test-mvn-retry.sh

    - name: Check the Maven fallback mirror against a dead Central
      run: scripts/ci/test-mirror-fallback.sh

    - name: Check the warm-once cache layout
      run: scripts/ci/test-maven-warm-once.sh

  test:
    name: Run Tests & Coverage
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: maven-warm
    if: ${{ !cancelled() }}
    permissions:
      pull-requests: write
      statuses: write
    # Testcontainers pulls postgres, mysql, nats and minio; anonymous pulls hit Docker Hub's rate
    # limit (EXC-792). Fork PRs have no secret and pull anonymously.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # no test here serves the real console (they use a small fixture), so the console build is left out; the
      # Console browser test job lints, tests and builds it
      MAVEN_ARGS: "-Dconsole.ui.skip=true"

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Log in to Docker Hub
      if: env.DOCKERHUB_USERNAME != ''
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache

    - name: Run tests with coverage
      run: mvn clean verify ${{ env.MAVEN_CLI_OPTS }}

    - name: Add coverage to PR
      id: jacoco
      uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
      if: github.event_name == 'pull_request'
      with:
        paths: |
          ${{ github.workspace }}/modules/excalibase-graphql-api/target/site/jacoco-aggregate/jacoco.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 40
        min-coverage-changed-files: 60

    - name: Upload coverage reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-reports
        # every report sonar.coverage.jacoco.xmlReportPaths names, plus the surefire reports (the tests measure).
        # pom.xml is only there so the common root is the workspace and the modules/... layout is kept.
        path: |
          pom.xml
          modules/*/target/site/jacoco/jacoco.xml
          modules/excalibase-graphql-api/target/site/jacoco-aggregate/jacoco.xml
          modules/*/target/surefire-reports/TEST-*.xml
        if-no-files-found: error
        retention-days: 7

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  # SonarCloud reads the coverage the test job measured instead of running the suite a second time (EXC-872).
  # Needs a green test job, so a failing suite never gets a Sonar result built on partial coverage.
  # Job name kept: it is the check that triggers the SonarCloud Code Analysis decoration.
  analyze:
    name: Build and analyze
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    needs: [maven-warm, test]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    env:
      # Sonar never serves the console and does not measure it, so its build is left out
      MAVEN_ARGS: "-Dconsole.ui.skip=true"

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0  # full history for accurate PR analysis

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'

    - name: Cache SonarCloud packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache

    - name: Download coverage from the test job
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: coverage-reports
        path: .

    # a missing report would silently shrink lines_to_cover in Sonar, so fail instead
    - name: Check every coverage report is there
      run: |
        missing=0
        for report in \
          modules/excalibase-graphql-api/target/site/jacoco-aggregate/jacoco.xml \
          modules/excalibase-graphql-api/target/site/jacoco/jacoco.xml \
          modules/excalibase-rls-core/target/site/jacoco/jacoco.xml \
          modules/excalibase-rls-jdbc/target/site/jacoco/jacoco.xml \
          modules/excalibase-graphql-mongodb/target/site/jacoco/jacoco.xml; do
          [[ -s $report ]] || { echo "::error::missing coverage report $report"; missing=1; }
        done
        exit $missing

    # compile only (main and test classes, no tests run, no clean so the downloaded report stays);
    # sonar.coverage.jacoco.xmlReportPaths in the pom names the reports downloaded above
    - name: Compile and analyze
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn test-compile org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar ${{ env.MAVEN_CLI_OPTS }}

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  build:
    name: Build & Package
    timeout-minutes: 20
    needs: [maven-warm, test]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    # the jar ships the console, so it is built here; its lint and Vitest run in the Console browser test job
    env:
      MAVEN_ARGS: "-Dconsole.ui.skipTests=true -Dconsole.ui.skipLint=true"

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'
        
    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache
    - name: Check that a build without the console drops a stale one
      run: scripts/ci/check-console-skip.sh

    - name: Build with Make
      run: make build

    # The engine, one database each (EXC-799). `verify` starts each slim jar against its own database in a container
    # and checks that it refuses the other; the all-in-one jar is started against both.
    - name: Build and start the slim jars
      run: |
        mvn -pl modules/excalibase-graphql-api -am -Pslim-postgres verify -DskipTests ${{ env.MAVEN_CLI_OPTS }}
        mvn -pl modules/excalibase-graphql-api -am -Pslim-mysql verify -DskipTests ${{ env.MAVEN_CLI_OPTS }}
        mvn -pl modules/excalibase-graphql-api -am -Pslim-sqlite verify -DskipTests ${{ env.MAVEN_CLI_OPTS }}

    - name: Start the all-in-one jar against every database
      run: >
        mvn -pl modules/excalibase-graphql-api -am test ${{ env.MAVEN_CLI_OPTS }}
        -Dtest=SlimBuildSmokeTest -Dsurefire.failIfNoSpecifiedTests=false
        -Dslim.command="$PWD/modules/excalibase-graphql-api/target/excalibase-graphql-api-0.0.1-SNAPSHOT.jar"
        -Dslim.serves=postgres,mysql,sqlite

    - name: Upload JAR artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: jar-artifacts
        path: |
          modules/excalibase-graphql-api/target/excalibase-graphql-api-0.0.1-SNAPSHOT.jar
          modules/excalibase-graphql-api/target/excalibase-graphql-api-0.0.1-SNAPSHOT-postgres.jar
          modules/excalibase-graphql-api/target/excalibase-graphql-api-0.0.1-SNAPSHOT-mysql.jar
          modules/excalibase-graphql-api/target/excalibase-graphql-api-0.0.1-SNAPSHOT-sqlite.jar
        if-no-files-found: error
        retention-days: 7

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  build-native:
    name: Build Native Image
    timeout-minutes: 40
    needs: [maven-warm, test]
    runs-on: ubuntu-24.04
    # Only on push to main — native compile takes ~10 min, skip on PRs
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    # the binary ships the console, so it is built here; its lint and Vitest run in the Console browser test job
    env:
      MAVEN_ARGS: "-Dconsole.ui.skipTests=true -Dconsole.ui.skipLint=true"

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'graalvm'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache

    - name: Install native-image prerequisites
      run: sudo apt-get update && sudo apt-get install -y gcc zlib1g-dev

    - name: Build native image
      run: mvn -pl modules/excalibase-graphql-api --also-make -Pnative package -DskipTests ${{ env.MAVEN_CLI_OPTS }}

    - name: Upload native binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: native-binary
        path: modules/excalibase-graphql-api/target/excalibase-graphql-api
        retention-days: 7

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report
