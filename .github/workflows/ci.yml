name: Continuous Integration

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '*.md'
      - '.github/workflows/docs.yml'

env:
  MAVEN_OPTS: "-Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

jobs:
  maven-warm:
    name: Warm Maven cache
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache
      with:
        warm: 'true'

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  cd-guard:
    name: CD tag guard
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Check the trunk tag guard
      run: scripts/ci/test-cd-guard.sh

    - name: Check the Maven retry loop
      run: scripts/ci/test-mvn-retry.sh

    - name: Check the Maven fallback mirror against a dead Central
      run: scripts/ci/test-mirror-fallback.sh

    - name: Check the warm-once cache layout
      run: scripts/ci/test-maven-warm-once.sh

  test:
    name: Run Tests & Coverage
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: maven-warm
    if: ${{ !cancelled() }}
    permissions:
      pull-requests: write
      statuses: write

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache

    - name: Run tests with coverage
      run: mvn clean verify ${{ env.MAVEN_CLI_OPTS }}

    - name: Add coverage to PR
      id: jacoco
      uses: madrapps/jacoco-report@50d3aff4548aa991e6753342d9ba291084e63848 # v1.7.2
      if: github.event_name == 'pull_request'
      with:
        paths: |
          ${{ github.workspace }}/modules/excalibase-graphql-api/target/site/jacoco-aggregate/jacoco.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 40
        min-coverage-changed-files: 60

    - name: Upload coverage reports
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage-reports
        path: modules/excalibase-graphql-api/target/site/jacoco-aggregate/
        retention-days: 7

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  build:
    name: Build & Package
    timeout-minutes: 20
    needs: [maven-warm, test]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'
        
    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache
    - name: Build with Make
      run: make build

    # The engine, one database each (EXC-799). `verify` starts each slim jar against its own database in a container
    # and checks that it refuses the other; the all-in-one jar is started against both.
    - name: Build and start the slim jars
      run: |
        mvn -pl modules/excalibase-graphql-api -am -Pslim-postgres verify -DskipTests ${{ env.MAVEN_CLI_OPTS }}
        mvn -pl modules/excalibase-graphql-api -am -Pslim-mysql verify -DskipTests ${{ env.MAVEN_CLI_OPTS }}

    - name: Start the all-in-one jar against both databases
      run: >
        mvn -pl modules/excalibase-graphql-api -am test ${{ env.MAVEN_CLI_OPTS }}
        -Dtest=SlimBuildSmokeTest -Dsurefire.failIfNoSpecifiedTests=false
        -Dslim.command="$PWD/modules/excalibase-graphql-api/target/excalibase-graphql-api-0.0.1-SNAPSHOT.jar"
        -Dslim.serves=postgres,mysql

    - name: Upload JAR artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: jar-artifacts
        path: |
          modules/excalibase-graphql-api/target/excalibase-graphql-api-0.0.1-SNAPSHOT.jar
          modules/excalibase-graphql-api/target/excalibase-graphql-api-0.0.1-SNAPSHOT-postgres.jar
          modules/excalibase-graphql-api/target/excalibase-graphql-api-0.0.1-SNAPSHOT-mysql.jar
        if-no-files-found: error
        retention-days: 7

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  build-native:
    name: Build Native Image
    timeout-minutes: 40
    needs: [maven-warm, test]
    runs-on: ubuntu-24.04
    # Only on push to main — native compile takes ~10 min, skip on PRs
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'graalvm'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache

    - name: Install native-image prerequisites
      run: sudo apt-get update && sudo apt-get install -y gcc zlib1g-dev

    - name: Build native image
      run: mvn -pl modules/excalibase-graphql-api --also-make -Pnative package -DskipTests ${{ env.MAVEN_CLI_OPTS }}

    - name: Upload native binary
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: native-binary
        path: modules/excalibase-graphql-api/target/excalibase-graphql-api
        retention-days: 7

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  # The slim native binaries, one database each (EXC-799). Each is started against its own database in a container,
  # and must refuse the other, before it is uploaded for CD.
  build-native-slim:
    name: Build Native Image (${{ matrix.engine }} only)
    timeout-minutes: 40
    needs: [maven-warm, test]
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, mysql]

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'graalvm'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache

    - name: Install native-image prerequisites
      run: sudo apt-get update && sudo apt-get install -y gcc zlib1g-dev

    - name: Build native image
      run: mvn -pl modules/excalibase-graphql-api --also-make -Pnative,slim-${{ matrix.engine }} package -DskipTests ${{ env.MAVEN_CLI_OPTS }}

    - name: Start the native binary against its database
      run: >
        mvn -pl modules/excalibase-graphql-api --also-make -Pslim-${{ matrix.engine }} test ${{ env.MAVEN_CLI_OPTS }}
        -Dtest=SlimBuildSmokeTest -Dsurefire.failIfNoSpecifiedTests=false
        -Dslim.command="$PWD/modules/excalibase-graphql-api/target/excalibase-graphql-api-${{ matrix.engine }}"
        -Dslim.serves=${{ matrix.engine }}

    - name: Upload native binary
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: native-binary-${{ matrix.engine }}
        path: modules/excalibase-graphql-api/target/excalibase-graphql-api-${{ matrix.engine }}
        retention-days: 7
        if-no-files-found: error

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report
