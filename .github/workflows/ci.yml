name: Continuous Integration

# release/** runs the same suites as main: a patch is cut on release/<major>.<minor>
# and CD (cd.yml) publishes release-<major>.<minor>-<sha> from the commit this run passes on.
on:
  push:
    branches: [ main, "release/**" ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main, "release/**" ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '*.md'
      - '.github/workflows/docs.yml'

# A new push to a pull request cancels the older run of that PR. Push runs on main/release are
# keyed by run id, so each is unique and never cancelled: cd.yml reads each push run's result.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # EXC-881: Docker Hub rate-limits CI, so third-party images come from the mirror the platform
  # repository's Mirror images workflow keeps in GHCR (ci/mirror-images.txt lists the ones used here).
  # Empty on a fork PR (no login there): everything then pulls Docker Hub as before.
  # HUB_MIRROR: compose files and Dockerfiles. IMAGE_MIRROR: scripts (ci/mirror-images.sh).
  # TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: Testcontainers, for every container the Java tests start.
  HUB_MIRROR: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'ghcr.io/excalibase/mirror/' || '' }}
  IMAGE_MIRROR: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'ghcr.io/excalibase/mirror' || '' }}
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'ghcr.io/excalibase/mirror/' || '' }}
  MAVEN_OPTS: "-Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

jobs:
  maven-warm:
    name: Warm Maven cache
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache
      with:
        warm: 'true'

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  cd-guard:
    name: CD tag guard
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Check the trunk tag guard
      run: scripts/ci/test-cd-guard.sh

    - name: Check the release tag guard
      run: scripts/ci/test-release-tag-guard.sh

    - name: Check the Maven retry loop
      run: scripts/ci/test-mvn-retry.sh

    - name: Check the Maven fallback mirror against a dead Central
      run: scripts/ci/test-mirror-fallback.sh

    - name: Check the warm-once cache layout
      run: scripts/ci/test-maven-warm-once.sh

    # EXC-881: every Docker Hub image CI names is on the mirror's list, and the mirror's scripts work.
    - name: Docker Hub images are mirrored
      run: |
        sh ci/tests/mirror-images-test.sh
        sh ci/mirror-images.sh guard

  # The suite runs in parallel shards (EXC-885). scripts/ci/test-shards.sh picks each shard's classes from
  # scripts/ci/test-shards.txt (the slow ones, balanced by measured time; any other class by a checksum of its name).
  test-shard:
    name: Tests shard ${{ matrix.shard }}
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    needs: maven-warm
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Testcontainers pulls postgres, mysql, nats and minio; anonymous pulls hit Docker Hub's rate
    # limit (EXC-792). Fork PRs have no secret and pull anonymously.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # no test here serves the real console (they use a small fixture), so the console build is left out; the
      # Console browser test job lints, tests and builds it
      MAVEN_ARGS: "-Dconsole.ui.skip=true"

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Log in to the image mirror
      uses: ./.github/actions/mirror-login

    - name: Log in to Docker Hub
      if: env.DOCKERHUB_USERNAME != ''
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Pre-pull the Testcontainers images once
      run: sh scripts/ci/prepull-test-images.sh

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache

    # the test classes of this shard only; every module is still built, so each test sees the same reactor as before
    - name: Run this shard's tests with coverage
      env:
        SHARD: ${{ matrix.shard }}
      run: |
        classes=$(scripts/ci/test-shards.sh select "$SHARD")
        echo "shard $SHARD runs $(tr ',' '\n' <<<"$classes" | wc -l) test classes"
        mvn clean verify ${{ env.MAVEN_CLI_OPTS }} -Dtest="$classes" -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false

    # what the coverage job needs: this shard's JaCoCo data under a name no other shard uses, and the classes it ran
    - name: Collect this shard's results
      if: ${{ !cancelled() }}
      env:
        SHARD: ${{ matrix.shard }}
      run: |
        for exec in modules/*/target/jacoco.exec; do
          [[ -f $exec ]] || continue
          mkdir -p "$(dirname "$exec")/shards"
          cp "$exec" "$(dirname "$exec")/shards/shard-$SHARD.exec"
        done
        mkdir -p shard-classes
        ls modules/*/target/surefire-reports/TEST-*.xml | sed -E 's#.*/TEST-(.*)\.xml$#\1#' >"shard-classes/$SHARD.txt"

    - name: Upload this shard's results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-shard-${{ matrix.shard }}
        # pom.xml is only there so the common root is the workspace and the modules/... layout is kept
        path: |
          pom.xml
          shard-classes/*.txt
          modules/*/target/shards/*.exec
          modules/*/target/surefire-reports/TEST-*.xml
        if-no-files-found: error
        retention-days: 7

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  # The required check "Run Tests & Coverage" (ruleset "Simple rule"): fails unless every shard passed, then merges
  # the shards' JaCoCo data into the reports Sonar and the PR comment read.
  test:
    name: Run Tests & Coverage
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    needs: [maven-warm, test-shard]
    if: ${{ !cancelled() }}
    permissions:
      pull-requests: write
      statuses: write
    env:
      MAVEN_ARGS: "-Dconsole.ui.skip=true"

    steps:
    - name: Every shard has to have passed
      env:
        SHARDS_RESULT: ${{ needs.test-shard.result }}
      run: |
        if [[ $SHARDS_RESULT != success ]]; then
          echo "::error::the test shards finished as '$SHARDS_RESULT', not success"
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download every shard's results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: test-shard-*
        merge-multiple: true
        path: .

    # a test added without being run by any shard, or run by two, fails here instead of going unnoticed
    - name: Check every test class ran exactly once
      run: scripts/ci/test-shards.sh check shard-classes/*.txt

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache

    # the classes are compiled again (no tests run) so the merged data is read against the same bytecode
    - name: Merge the shards' coverage and write the reports
      run: mvn ${{ env.MAVEN_CLI_OPTS }} compile jacoco:merge@merge-shards jacoco:report@report jacoco:report-aggregate@report-aggregate

    - name: Add coverage to PR
      id: jacoco
      uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
      if: github.event_name == 'pull_request'
      with:
        paths: |
          ${{ github.workspace }}/modules/excalibase-graphql-api/target/site/jacoco-aggregate/jacoco.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 40
        min-coverage-changed-files: 60

    - name: Upload coverage reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-reports
        # every report sonar.coverage.jacoco.xmlReportPaths names, plus the surefire reports (the tests measure).
        # pom.xml is only there so the common root is the workspace and the modules/... layout is kept.
        path: |
          pom.xml
          modules/*/target/site/jacoco/jacoco.xml
          modules/excalibase-graphql-api/target/site/jacoco-aggregate/jacoco.xml
          modules/*/target/surefire-reports/TEST-*.xml
        if-no-files-found: error
        retention-days: 7

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  # SonarCloud reads the coverage the test job measured instead of running the suite a second time (EXC-872).
  # Needs a green test job, so a failing suite never gets a Sonar result built on partial coverage.
  # Job name kept: it is the check that triggers the SonarCloud Code Analysis decoration.
  analyze:
    name: Build and analyze
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    needs: [maven-warm, test]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    env:
      # Sonar never serves the console and does not measure it, so its build is left out
      MAVEN_ARGS: "-Dconsole.ui.skip=true"

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0  # full history for accurate PR analysis

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'

    - name: Cache SonarCloud packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache

    - name: Download coverage from the test job
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: coverage-reports
        path: .

    # a missing report would silently shrink lines_to_cover in Sonar, so fail instead
    - name: Check every coverage report is there
      run: |
        missing=0
        for report in \
          modules/excalibase-graphql-api/target/site/jacoco-aggregate/jacoco.xml \
          modules/excalibase-graphql-api/target/site/jacoco/jacoco.xml \
          modules/excalibase-rls-core/target/site/jacoco/jacoco.xml \
          modules/excalibase-rls-jdbc/target/site/jacoco/jacoco.xml \
          modules/excalibase-graphql-mongodb/target/site/jacoco/jacoco.xml; do
          [[ -s $report ]] || { echo "::error::missing coverage report $report"; missing=1; }
        done
        exit $missing

    # compile only (main and test classes, no tests run, no clean so the downloaded report stays);
    # sonar.coverage.jacoco.xmlReportPaths in the pom names the reports downloaded above
    - name: Compile and analyze
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn test-compile org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar ${{ env.MAVEN_CLI_OPTS }}

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  build:
    name: Build & Package
    timeout-minutes: 20
    needs: [maven-warm, test]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    # the jar ships the console, so it is built here; its lint and Vitest run in the Console browser test job
    env:
      MAVEN_ARGS: "-Dconsole.ui.skipTests=true -Dconsole.ui.skipLint=true"
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Log in to the image mirror
      uses: ./.github/actions/mirror-login

    - name: Log in to Docker Hub
      if: env.DOCKERHUB_USERNAME != ''
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Pre-pull the Testcontainers images once
      run: sh scripts/ci/prepull-test-images.sh postgres:16-alpine mysql:8.4

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'
        
    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache
    - name: Check that a build without the console drops a stale one
      run: scripts/ci/check-console-skip.sh

    - name: Build with Make
      run: make build

    # The engine, one database each (EXC-799). `verify` starts each slim jar against its own database in a container
    # and checks that it refuses the other; the all-in-one jar is started against both.
    - name: Build and start the slim jars
      run: |
        mvn -pl modules/excalibase-graphql-api -am -Pslim-postgres verify -DskipTests ${{ env.MAVEN_CLI_OPTS }}
        mvn -pl modules/excalibase-graphql-api -am -Pslim-mysql verify -DskipTests ${{ env.MAVEN_CLI_OPTS }}
        mvn -pl modules/excalibase-graphql-api -am -Pslim-sqlite verify -DskipTests ${{ env.MAVEN_CLI_OPTS }}

    - name: Start the all-in-one jar against every database
      run: >
        mvn -pl modules/excalibase-graphql-api -am test ${{ env.MAVEN_CLI_OPTS }}
        -Dtest=SlimBuildSmokeTest -Dsurefire.failIfNoSpecifiedTests=false
        -Dslim.command="$PWD/modules/excalibase-graphql-api/target/excalibase-graphql-api-0.0.1-SNAPSHOT.jar"
        -Dslim.serves=postgres,mysql,sqlite

    - name: Upload JAR artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: jar-artifacts
        path: |
          modules/excalibase-graphql-api/target/excalibase-graphql-api-0.0.1-SNAPSHOT.jar
          modules/excalibase-graphql-api/target/excalibase-graphql-api-0.0.1-SNAPSHOT-postgres.jar
          modules/excalibase-graphql-api/target/excalibase-graphql-api-0.0.1-SNAPSHOT-mysql.jar
          modules/excalibase-graphql-api/target/excalibase-graphql-api-0.0.1-SNAPSHOT-sqlite.jar
        if-no-files-found: error
        retention-days: 7

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report

  build-native:
    name: Build Native Image
    timeout-minutes: 40
    needs: [maven-warm, test]
    runs-on: ubuntu-24.04
    # Only on push to main — native compile takes ~10 min, skip on PRs
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    # the binary ships the console, so it is built here; its lint and Vitest run in the Console browser test job
    env:
      MAVEN_ARGS: "-Dconsole.ui.skipTests=true -Dconsole.ui.skipLint=true"

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up GraalVM JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'graalvm'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache

    - name: Install native-image prerequisites
      run: sudo apt-get update && sudo apt-get install -y gcc zlib1g-dev

    - name: Build native image
      run: mvn -pl modules/excalibase-graphql-api --also-make -Pnative package -DskipTests ${{ env.MAVEN_CLI_OPTS }}

    - name: Upload native binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: native-binary
        path: modules/excalibase-graphql-api/target/excalibase-graphql-api
        retention-days: 7

    - name: Maven downloads in this job
      if: always()
      run: scripts/ci/m2-files.sh report
