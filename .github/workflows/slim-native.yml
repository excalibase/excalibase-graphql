name: Slim Native Images

# The native binaries of the one-database engine images (EXC-799), built nightly and on request, never per push:
# a slim native failure must not block CI or the CD of the all-in-one image. Each build is started against its own
# database and must refuse the other before its image is scanned and pushed, as <jvm tag>-native:
#   main-<engine>-native and main-<sha7>-<engine>-native
# A release promotes these tags, so run this workflow for the commit to release (Run workflow, sha) before it.
on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to build, a main commit whose CI passed (default: the tip of main)"
        required: false
        default: ""

concurrency:
  group: slim-native-${{ inputs.sha || github.sha }}
  cancel-in-progress: false

env:
  DOCKER_IMAGE: excalibase/excalibase-graphql
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  # the binaries ship the console, so it is built; its lint and Vitest run in the Console browser test job
  MAVEN_ARGS: "-Dconsole.ui.skipTests=true -Dconsole.ui.skipLint=true"
  COMMIT_SHA: ${{ inputs.sha || github.sha }}

jobs:
  maven-warm:
    name: Warm Maven cache
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: github.repository == 'excalibase/excalibase-graphql' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'corretto'

    - name: Shared Maven cache
      uses: ./.github/actions/maven-cache
      with:
        warm: 'true'

  slim-native:
    name: Build & Push ${{ matrix.engine }} Native Docker Image
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: maven-warm
    permissions:
      contents: read
      actions: read
    if: ${{ !cancelled() && github.repository == 'excalibase/excalibase-graphql' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, mysql]

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ env.COMMIT_SHA }}

    # Only a commit that CI passed on main is published, as CD does.
    - name: Require a green CI run of this commit
      id: ci
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Continuous Integration" --commit "$COMMIT_SHA" \
          --event push --branch main --status success --json databaseId --jq 'length')
        if [ "$passed" = "0" ]; then
          echo "::notice::no successful CI run of $COMMIT_SHA on main; nothing is built"
        fi
        echo "passed=$passed" >> "$GITHUB_OUTPUT"

    - name: Resolve commit
      id: commit
      run: echo "short=${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"

    - name: Check the trunk tag is unused
      id: trunk
      if: steps.ci.outputs.passed != '0'
      run: |
        exists=$(scripts/ci/trunk-tag-exists.sh "$DOCKER_IMAGE" "main-${{ steps.commit.outputs.short }}-${{ matrix.engine }}-native")
        echo "exists=$exists" >> "$GITHUB_OUTPUT"
        if [ "$exists" = "true" ]; then
          echo "::notice::main-${{ steps.commit.outputs.short }}-${{ matrix.engine }}-native already exists; leaving it untouched"
        fi

    - name: Set up GraalVM JDK 25
      if: steps.ci.outputs.passed != '0' && steps.trunk.outputs.exists != 'true'
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'graalvm'

    - name: Shared Maven cache
      if: steps.ci.outputs.passed != '0' && steps.trunk.outputs.exists != 'true'
      uses: ./.github/actions/maven-cache

    - name: Install native-image prerequisites
      if: steps.ci.outputs.passed != '0' && steps.trunk.outputs.exists != 'true'
      run: sudo apt-get update && sudo apt-get install -y gcc zlib1g-dev

    - name: Build native image
      if: steps.ci.outputs.passed != '0' && steps.trunk.outputs.exists != 'true'
      run: mvn -pl modules/excalibase-graphql-api --also-make -Pnative,slim-${{ matrix.engine }} package -DskipTests ${{ env.MAVEN_CLI_OPTS }}

    - name: Start the native binary against its database
      if: steps.ci.outputs.passed != '0' && steps.trunk.outputs.exists != 'true'
      run: >
        mvn -pl modules/excalibase-graphql-api --also-make -Pslim-${{ matrix.engine }} test ${{ env.MAVEN_CLI_OPTS }}
        -Dtest=SlimBuildSmokeTest -Dsurefire.failIfNoSpecifiedTests=false
        -Dslim.command="$PWD/modules/excalibase-graphql-api/target/excalibase-graphql-api-${{ matrix.engine }}"
        -Dslim.serves=${{ matrix.engine }}

    - name: Make binary executable
      if: steps.ci.outputs.passed != '0' && steps.trunk.outputs.exists != 'true'
      run: chmod +x modules/excalibase-graphql-api/target/excalibase-graphql-api-${{ matrix.engine }}

    - name: Set up Docker Buildx
      if: steps.ci.outputs.passed != '0' && steps.trunk.outputs.exists != 'true'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to DockerHub
      if: steps.ci.outputs.passed != '0' && steps.trunk.outputs.exists != 'true'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      if: steps.ci.outputs.passed != '0' && steps.trunk.outputs.exists != 'true'
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
      with:
        images: ${{ env.DOCKER_IMAGE }}
        labels: org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
        tags: |
          type=raw,value=main-${{ matrix.engine }}-native
          type=raw,value=main-${{ steps.commit.outputs.short }}-${{ matrix.engine }}-native

    - name: Build the candidate image
      if: steps.ci.outputs.passed != '0' && steps.trunk.outputs.exists != 'true'
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: .
        file: Dockerfile.native
        build-args: ENGINE=${{ matrix.engine }}
        load: true
        push: false
        tags: graphql-${{ matrix.engine }}-native-candidate:${{ env.COMMIT_SHA }}

    - name: Trivy
      if: steps.ci.outputs.passed != '0' && steps.trunk.outputs.exists != 'true'
      uses: ./.github/actions/trivy
      with:
        image: graphql-${{ matrix.engine }}-native-candidate:${{ env.COMMIT_SHA }}

    - name: Build and push native Docker image
      if: steps.ci.outputs.passed != '0' && steps.trunk.outputs.exists != 'true'
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: .
        file: Dockerfile.native
        build-args: ENGINE=${{ matrix.engine }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
