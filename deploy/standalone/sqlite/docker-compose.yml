# The engine on a SQLite file: no database server. One replica only (a file has one writer).
services:
  engine:
    image: ${ENGINE_IMAGE:-excalibase/excalibase-graphql:main}
    ports:
      - "10000:10000"
    environment:
      SERVER_PORT: 10000
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/app.db
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.sqlite.JDBC
      APP_DATABASE_TYPE: sqlite
      APP_PROJECT_ID: my-app
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:?set a random secret of 32 bytes or more, e.g. openssl rand -base64 48}
      APP_AUTH_AUDIENCE: my-app-api
      # Readiness reports not ready while no valid permissions file is loaded. /actuator/health also checks the database.
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      METADATA_SOURCE: file
      METADATA_FILE_PATH: /etc/excalibase
    volumes:
      - ./data:/data
      - ./metadata:/etc/excalibase:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness && curl -fsS http://localhost:8081/actuator/health"]
      interval: 10s
      retries: 6
      start_period: 30s
