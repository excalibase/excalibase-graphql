# The engine with its permissions fetched from a URL: Postgres + engine + a stand-in document server.
#   docker compose -f docker-compose.url.yml up
# Edit ./metadata/permissions.yaml; the engine picks the change up within a few polls. In real use the URL
# is your own service and METADATA_URL_TOKEN is the bearer token it expects.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: change-me
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 20

  documents:
    image: nginx:alpine
    volumes:
      - ./metadata:/usr/share/nginx/html:ro

  engine:
    # Needs an engine build that includes EXC-733 phase 1 (`metadata.source`). `latest` is the last release and may
    # predate it; use `main` or the first release that includes it, via ENGINE_IMAGE.
    image: ${ENGINE_IMAGE:-excalibase/excalibase-graphql:main}
    depends_on:
      postgres:
        condition: service_healthy
      documents:
        condition: service_started
    ports:
      - "10000:10000"
    environment:
      SERVER_PORT: 10000
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: change-me
      APP_DATABASE_TYPE: postgres
      APP_PROJECT_ID: my-app
      # The metadata document's `jwt:` section reads this shared secret (HS256). Use a long random value.
      APP_SECURITY_JWT_ENABLED: "true"
      JWT_SECRET: change-me-to-a-long-random-secret-of-32-bytes-or-more
      # The permission source: this URL. Plain http is only accepted for localhost and *.svc / *.cluster.local
      # names; this compose service name is none of those, so it is accepted explicitly. Use https in real life.
      METADATA_SOURCE: url
      METADATA_URL_LOCATION: http://documents/permissions.yaml
      METADATA_URL_ALLOW_INSECURE: "true"
      # METADATA_URL_TOKEN: change-me
      METADATA_URL_POLL_INTERVAL_MS: 5000
      # Readiness reports not ready while no valid permissions file is loaded.
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      retries: 6
      start_period: 30s
